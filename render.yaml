services:
  - type: web
    name: appointly
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && (cd frontend && npm install --no-audit --no-fund && npm run build)
    startCommand: flask --app app db upgrade && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.4}
      - {key: SECRET_KEY, generateValue: true}
      - {key: CRON_SECRET, generateValue: true}
      - {key: DATABASE_URL, sync: false}
      - {key: RESEND_API_KEY, sync: false}
      - {key: MAIL_FROM, value: "Appointly <onboarding@resend.dev>"}
      - {key: APP_URL, sync: false}

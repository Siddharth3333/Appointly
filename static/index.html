<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appointly</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#0f1b2d;--mut:#64708a;--line:#e3e6ec;--teal:#0f766e;--blue:#3b5b8c;--bad:#b42318;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#121b2d;--ink:#e8ecf4;--mut:#93a0b8;--line:#223049;--teal:#2dd4bf;--blue:#8fb0e6;--bad:#f87171;color-scheme:dark}}
[data-theme=dark]{--bg:#0b1220;--card:#121b2d;--ink:#e8ecf4;--mut:#93a0b8;--line:#223049;--teal:#2dd4bf;--blue:#8fb0e6;--bad:#f87171;color-scheme:dark}[data-theme=light]{--bg:#f4f5f7;--card:#fff;--ink:#0f1b2d;--mut:#64708a;--line:#e3e6ec;--teal:#0f766e;--blue:#3b5b8c;--bad:#b42318;color-scheme:light}dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(460px,92vw)}dialog::backdrop{background:#0008}.fc{font-size:13px}.fc .fc-button{background:var(--teal);border:0}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--teal)}h1,h2,h3{margin:0 0 .5rem;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}@media(max-width:760px){.app{grid-template-columns:1fr}.side{flex-direction:row!important;overflow-x:auto;position:sticky;top:0;z-index:5}.side .brand{display:none}}
.side{background:#0f1b2d;color:#c9d3e6;padding:16px;display:flex;flex-direction:column;gap:4px}.brand{font-weight:700;font-size:20px;color:#fff;padding:4px 10px 16px}
.side button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;white-space:nowrap}.side button:hover{background:#1b2b45}.side button.on{background:#14b8a6;color:#04201d;font-weight:600}.side .sp{flex:1}
main{padding:24px;max-width:1000px;width:100%}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}.stat b{font-size:26px;display:block}.stat span{color:var(--mut);font-size:13px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1;min-width:130px}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:8px 14px;background:var(--teal);color:#fff;cursor:pointer;width:auto}.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.d{background:var(--bad)}.btn.s{padding:4px 9px;font-size:13px}
@media(prefers-color-scheme:dark){.btn{color:#04201d}.btn.d{color:#fff}}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mut);font-weight:500;font-size:13px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--line)}.tag.confirmed,.tag.sent{background:#d1f2ec;color:#0b5a53}.tag.cancelled,.tag.failed{background:#fde4e1;color:#912018}.tag.completed{background:#dbe6f7;color:#2a4670}
.empty{color:var(--mut);text-align:center;padding:28px}.toast{position:fixed;bottom:18px;right:18px;background:#0f1b2d;color:#fff;padding:10px 16px;border-radius:8px;z-index:9}
.slots{display:flex;flex-wrap:wrap;gap:8px}.slots button{width:auto}.pub{max-width:560px;margin:32px auto;padding:0 16px}.skel{height:44px;border-radius:8px;background:var(--line);animation:p 1.2s infinite alternate}@keyframes p{to{opacity:.4}}@media(prefers-reduced-motion:reduce){.skel{animation:none}}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
</style></head><body><div id="root"></div><script>
const $=s=>document.querySelector(s),R=$('#root');let ME=null,CSRF='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{...(b?{'Content-Type':'application/json'}:{}),'X-CSRF-Token':CSRF},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Request failed'),{status:r.status});return j}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
const tzf=()=>ME?.timezone||undefined,fmt=(iso,z)=>new Date(iso).toLocaleString([], {dateStyle:'medium',timeStyle:'short',timeZone:z||tzf()});
const act=async(f,ok)=>{try{await f();ok&&toast(ok)}catch(e){toast(e.message)}};
const path=location.pathname;
if(path.startsWith('/book/'))pubBook(path.split('/')[2]);else if(path.startsWith('/manage/'))manage(path.split('/')[2]);else boot();

async function boot(){try{ME=await api('/me');CSRF=ME.csrf;shell('dashboard')}catch{authView()}}
function authView(reg){R.innerHTML=`<div class="pub"><h1>Appointly</h1><p style="color:var(--mut)">Bookings, clients and reminders in one place.</p><div class="card"><form id=f>
${reg?'<div class=row><input name=name placeholder="Your name" required><input name=business_name placeholder="Business name" required></div>':''}
<div class=row><input name=email type=email placeholder="Email" required><input name=password type=password placeholder="Password (8+ characters)" required minlength=8></div>
<button class=btn>${reg?'Create account':'Sign in'}</button> <button type=button class="btn g" id=sw>${reg?'I have an account':'Create an account'}</button></form></div></div>`;
$('#sw').onclick=()=>authView(!reg);$('#f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(reg)d.timezone=Intl.DateTimeFormat().resolvedOptions().timeZone;act(async()=>{await api('/auth/'+(reg?'register':'login'),'POST',d);boot()})}}
document.documentElement.dataset.theme=localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const NAV=[['dashboard','Dashboard'],['calendar','Calendar'],['analytics','Analytics'],['appointments','Appointments'],['clients','Clients'],['services','Services'],['availability','Availability'],['notifications','Reminders log'],['settings','Settings']];
function shell(v){R.innerHTML=`<div class=app><nav class=side><div class=brand>Appointly</div>${NAV.map(([k,l])=>`<button class="${k==v?'on':''}" data-v=${k}>${l}</button>`).join('')}<div class=sp></div><button id=th>Dark / light</button><button id=lo>Sign out</button></nav><main><div id=tb class=row style="align-items:center"></div><div id=m><div class=skel></div></div></main></div>`;
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>shell(b.dataset.v));$('#th').onclick=()=>{const d=document.documentElement.dataset;d.theme=localStorage.theme=d.theme=='dark'?'light':'dark'};$('#lo').onclick=async()=>{await api('/auth/logout','POST',{});ME=null;authView()};
topbar();V[v]().catch(e=>$('#m').innerHTML=`<div class=card>${esc(e.message)}</div>`)}
const set=h=>$('#m').innerHTML=h;
const V={
async dashboard(){const s=await api('/stats');const a=(await api('/appointments')).filter(x=>['pending','confirmed'].includes(x.status)&&new Date(x.start_utc)>new Date()).reverse().slice(0,6);
const L=[['Total',s.total],['Today',s.today],['Upcoming',s.upcoming],['Completed',s.completed],['Cancelled',s.cancelled],['No-show',s.no_show],['Clients',s.clients],['Revenue',s.revenue.toFixed(2)]];
set(`<h2>Dashboard</h2><div class=grid>${L.map(([l,n])=>`<div class="card stat" style="margin:0"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
<div class=card><h3>Next appointments</h3>${a.length?`<table>${a.map(x=>`<tr><td>${fmt(x.start_utc)}</td><td>${esc(x.client.name)}</td><td>${esc(x.service.name)}</td></tr>`).join('')}</table>`:'<div class=empty>Nothing booked yet. Share your booking link below to get started.</div>'}</div>
<div class=card><h3>Your public booking link</h3><a href="/book/${ME.slug}" target=_blank>${location.origin}/book/${ME.slug}</a></div>`)},
async appointments(){const [list,sv]=await Promise.all([api('/appointments'),api('/services')]);
set(`<h2>Appointments</h2><div class=card><form id=f><div class=row><input name=name placeholder="Client name" required><input name=email type=email placeholder="Client email" required><input name=phone placeholder="Phone"></div>
<div class=row><select name=service_id required>${sv.filter(s=>s.active).map(s=>`<option value=${s.id}>${esc(s.name)} (${s.duration_min} min)</option>`).join('')||'<option value="">Add a service first</option>'}</select><input name=start type=datetime-local required><button class=btn>Book</button></div></form></div>
<div class=card>${list.length?`<table><tr><th>When</th><th>Client</th><th>Service</th><th>Status</th><th></th></tr>${list.map(a=>`<tr><td>${fmt(a.start_utc)}</td><td>${esc(a.client.name)}<br><small>${esc(a.client.email)}</small></td><td>${esc(a.service.name)}</td><td><span class="tag ${a.status}">${a.status.replace('_','-')}</span></td><td>
<button class="btn g s" data-a=${a.id} data-s=completed>Done</button> <button class="btn g s" data-a=${a.id} data-s=no_show>No-show</button> <button class="btn g s" data-a=${a.id} data-r=1>Move</button> <button class="btn g s" data-e=${a.id}>Edit</button> <button class="btn g s" data-a=${a.id} data-s=cancelled>Cancel</button> <button class="btn d s" data-a=${a.id} data-x=1>Delete</button></td></tr>`).join('')}</table>`:'<div class=empty>No appointments yet.</div>'}</div>`);
$('#f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.start=new Date(d.start).toISOString();act(async()=>{await api('/appointments','POST',d);shell('appointments')},'Booked')};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(async()=>{const id=b.dataset.a;
if(b.dataset.x){if(!confirm('Delete this appointment permanently?'))return;await api('/appointments/'+id,'DELETE',{})}
else if(b.dataset.r){const v=prompt('New date and time (YYYY-MM-DD HH:MM, your browser time)');if(!v)return;await api('/appointments/'+id,'PATCH',{start:new Date(v.replace(' ','T')).toISOString()})}
else{if(b.dataset.s=='cancelled'&&!confirm('Cancel and notify the client?'))return;await api('/appointments/'+id,'PATCH',{status:b.dataset.s})}
shell('appointments')},'Updated'))},
async clients(){const l=await api('/clients');set(`<h2>Clients</h2><div class=card><form id=f class=row><input name=name placeholder=Name required><input name=email type=email placeholder=Email required><input name=phone placeholder=Phone><button class=btn>Add client</button></form></div>
<div class=card>${l.length?`<table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Visits</th><th></th></tr>${l.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${c.appointments}</td><td><button class="btn d s" data-d=${c.id}>Delete</button></td></tr>`).join('')}</table>`:'<div class=empty>Clients appear here when you add them or when someone books.</div>'}</div>`);
$('#f').onsubmit=e=>{e.preventDefault();act(async()=>{await api('/clients','POST',Object.fromEntries(new FormData(e.target)));shell('clients')},'Client saved')};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>confirm('Delete client and their appointments?')&&act(async()=>{await api('/clients/'+b.dataset.d,'DELETE',{});shell('clients')},'Deleted'))},
async services(){const l=await api('/services');set(`<h2>Services</h2><div class=card><form id=f class=row><input name=name placeholder="Service name" required><input name=duration_min type=number min=5 placeholder="Minutes" required><input name=price type=number step=.01 placeholder=Price><input name=color type=color value="#0f766e" style="max-width:60px"><button class=btn>Add</button></form></div>
<div class=card>${l.length?`<table>${l.map(s=>`<tr><td><span style="color:${esc(s.color)}">●</span> ${esc(s.name)}</td><td>${s.duration_min} min</td><td>${s.price}</td><td>${s.active?'':'<span class=tag>inactive</span>'}</td><td><button class="btn d s" data-d=${s.id}>Remove</button></td></tr>`).join('')}</table>`:'<div class=empty>Add your first service so clients can book it.</div>'}</div>`);
$('#f').onsubmit=e=>{e.preventDefault();act(async()=>{await api('/services','POST',Object.fromEntries(new FormData(e.target)));shell('services')},'Service added')};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>act(async()=>{await api('/services/'+b.dataset.d,'DELETE',{});shell('services')},'Removed'))},
async availability(){const l=await api('/availability'),D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const m=Object.fromEntries(l.map(r=>[r.weekday,r]));
set(`<h2>Availability</h2><p style="color:var(--mut)">Hours, then optional break start and end for each day.</p><div class=card><form id=f>${D.map((d,i)=>`<div class=row style="align-items:center"><label style="max-width:80px"><input type=checkbox name=on${i} style="width:auto" ${m[i]?'checked':''}> ${d}</label><input type=time name=s${i} value="${m[i]?.start||'09:00'}"><input type=time name=e${i} value="${m[i]?.end||'17:00'}"><input type=time name=bs${i} value="${m[i]?.break_start||''}" title="Break start"><input type=time name=be${i} value="${m[i]?.break_end||''}" title="Break end"></div>`).join('')}<button class=btn>Save hours</button></form></div>`);
$('#f').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),b=[];D.forEach((_,i)=>f.get('on'+i)&&b.push({weekday:i,start:f.get('s'+i),end:f.get('e'+i),break_start:f.get('bs'+i)||null,break_end:f.get('be'+i)||null}));act(()=>api('/availability','PUT',b),'Hours saved')}},
async notifications(){const l=await api('/notifications');set(`<h2>Reminders log</h2><div class=card>${l.length?`<table><tr><th>Type</th><th>To</th><th>Due</th><th>Status</th><th>Detail</th></tr>${l.map(n=>`<tr><td>${esc(n.kind)}</td><td>${esc(n.recipient)}</td><td>${fmt(n.due_at)}</td><td><span class="tag ${n.status}">${n.status}</span></td><td><small>${esc(n.error||'')}</small></td></tr>`).join('')}</table>`:'<div class=empty>Emails queue here when appointments are booked.</div>'}</div>`)},
async settings(){set(`<h2>Settings</h2><div class=card><form id=f><div class=row><input name=business_name value="${esc(ME.business_name)}"><input name=timezone value="${esc(ME.timezone)}"></div><div class=row><label>Buffer (min)<input name=buffer_min type=number min=0 value=${ME.buffer_min}></label><label>Min notice (hours)<input name=min_notice_h type=number min=0 value=${ME.min_notice_h}></label><label>Booking window (days)<input name=max_days type=number min=1 value=${ME.max_days}></label></div>
<label>Reminder hours before (comma-separated)<input name=reminder_hours value="${esc(ME.reminder_hours)}"></label><br><br><button class=btn>Save settings</button></form></div>`);
$('#f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));['buffer_min','min_notice_h','max_days'].forEach(k=>d[k]=+d[k]);act(async()=>{await api('/me','PATCH',d);ME=await api('/me')},'Settings saved')}}};

V.calendar=async function(){const [list,sv]=await Promise.all([api('/appointments'),api('/services')]);set('<h2>Calendar</h2><div class=card><div class=row><select id=fs><option value="">All services</option>'+sv.map(s=>`<option value=${s.id}>${esc(s.name)}</option>`).join('')+'</select><select id=ft><option value="">All statuses</option>'+['pending','confirmed','completed','cancelled','no_show'].map(x=>`<option>${x}</option>`).join('')+'</select></div><div id=cal></div></div>');
const ev=()=>list.filter(a=>(!$('#fs').value||a.service.id==$('#fs').value)&&(!$('#ft').value||a.status==$('#ft').value)).map(a=>({id:a.id,title:a.client.name+' · '+a.service.name,start:a.start_utc,end:a.end_utc,color:a.status=='cancelled'?'#9aa3b5':a.service.color,editable:['pending','confirmed'].includes(a.status)}));
const cal=new FullCalendar.Calendar($('#cal'),{timeZone:ME.timezone,initialView:innerWidth<760?'listWeek':'dayGridMonth',height:'auto',nowIndicator:true,
headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek,timeGridDay,listWeek'},buttonText:{listWeek:'agenda'},events:(i,ok)=>ok(ev()),
eventDrop:async i=>{try{await api('/appointments/'+i.event.id,'PATCH',{start:i.event.start.toISOString()});toast('Rescheduled')}catch(e){i.revert();toast(e.message)}},
dateClick:i=>{if(!sv.length)return toast('Add a service first');const n=prompt('Client name');if(!n)return;const e=prompt('Client email');if(!e)return;const k=prompt('Service number:\n'+sv.map((s,j)=>(j+1)+'. '+s.name).join('\n'),'1');const s=sv[(+k||1)-1];
const t=i.allDay?i.dateStr+'T09:00:00':i.dateStr.slice(0,19);const z=new Date(new Date(t+'Z').getTime()-tzOff(t,ME.timezone));act(async()=>{await api('/appointments','POST',{name:n,email:e,service_id:s.id,start:z.toISOString()});shell('calendar')},'Booked')}});
cal.render();$('#fs').onchange=$('#ft').onchange=()=>cal.refetchEvents()};
function tzOff(t,z){const d=new Date(t+'Z'),p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:z,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-d.getTime()}
V.analytics=async function(){const days=+(sessionStorage.days||30),a=await api('/analytics?days='+days);set(`<h2>Analytics</h2><div class=row><select id=dr>${[7,30,90,365].map(d=>`<option ${d==days?'selected':''} value=${d}>Last ${d} days</option>`).join('')}</select><button class="btn g" id=ex>Export appointments CSV</button></div>
<div class=grid>${[['Bookings',a.total],['Completed',a.completed],['Cancellation %',a.cancellation_rate],['No-show %',a.no_show_rate],['New clients',a.new_clients],['Revenue',a.revenue.toFixed(2)]].map(([l,n])=>`<div class="card stat" style="margin:0"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
<div class=card><h3>Bookings per day</h3><canvas id=c1 height=90></canvas></div><div class=card><h3>Popular services</h3><canvas id=c2 height=90></canvas></div><div class=card><h3>Monthly trend</h3>${a.monthly.length?`<table>${a.monthly.map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td></tr>`).join('')}</table>`:'<div class=empty>No data in this range.</div>'}</div>`);
$('#dr').onchange=e=>{sessionStorage.days=e.target.value;shell('analytics')};$('#ex').onclick=()=>location.href='/api/export/appointments.csv';
const mk=(id,type,d)=>new Chart($(id),{type,data:{labels:d.map(x=>x[0]),datasets:[{data:d.map(x=>x[1]),backgroundColor:'#0f766e'}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});mk('#c1','bar',a.daily);mk('#c2','bar',a.services)};
const _av=V.availability;V.availability=async function(){await _av();const l=await api('/blocked');$('#m').insertAdjacentHTML('beforeend',`<h3>Blocked time & holidays</h3><div class=card><form id=bf class=row><input type=datetime-local name=start required><input type=datetime-local name=end required><input name=reason placeholder="Reason (holiday, break)"><button class=btn>Block</button></form>${l.length?`<table>${l.map(b=>`<tr><td>${fmt(b.start_utc)} to ${fmt(b.end_utc)}</td><td>${esc(b.reason)}</td><td><button class="btn d s" data-b=${b.id}>Remove</button></td></tr>`).join('')}</table>`:'<div class=empty>No blocked time.</div>'}</div>`);
$('#bf').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.start=new Date(d.start).toISOString();d.end=new Date(d.end).toISOString();act(async()=>{await api('/blocked','POST',d);shell('availability')},'Time blocked')};
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>act(async()=>{await api('/blocked/'+b.dataset.b,'DELETE',{});shell('availability')},'Removed'))};
const _cl=V.clients;V.clients=async function(){await _cl();$('#m').insertAdjacentHTML('afterbegin','<div class=row><label class="btn g" style="text-align:center">Import clients CSV (name,email,phone)<input type=file id=imp accept=.csv hidden></label></div>');
$('#imp').onchange=e=>{const r=new FileReader();r.onload=()=>act(async()=>{const x=await api('/import/clients','POST',{csv:r.result});toast(x.added+' added, '+x.skipped+' skipped');shell('clients')});r.readAsText(e.target.files[0])}};

const bindP=()=>document.querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{e.preventDefault();V.profile(a.dataset.p)});
function topbar(){$('#tb').innerHTML='<input id=gs placeholder="Search clients, appointments, services (Enter)" style="max-width:380px"><button class="btn g" id=bell>Alerts</button><button class=btn id=nq>+ New appointment</button>';
api('/notifications/summary').then(s=>{$('#bell').textContent='Alerts'+(s.failed?` (${s.failed} failed)`:'')}).catch(()=>{});
$('#nq').onclick=()=>shell('appointments');$('#bell').onclick=()=>shell('notifications');
$('#gs').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim().length>1)V.search(e.target.value.trim())}}
const ls=a=>a.length?`<table>${a.map(x=>`<tr><td>${fmt(x.start_utc)}</td><td>${esc(x.client.name)}</td><td>${esc(x.service.name)}</td><td><span class="tag ${x.status}">${x.status.replace('_','-')}</span></td></tr>`).join('')}</table>`:'<div class=empty>None.</div>';
V.search=async function(q){const r=await api('/search?q='+encodeURIComponent(q));set(`<h2>Results for “${esc(q)}”</h2><div class=card><h3>Clients</h3>${r.clients.length?`<table>${r.clients.map(c=>`<tr><td><a href=# data-p=${c.id}>${esc(c.name)}</a></td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td></tr>`).join('')}</table>`:'<div class=empty>No clients found.</div>'}</div><div class=card><h3>Appointments</h3>${ls(r.appointments)}</div>`);bindP()};
V.profile=async function(id){const c=await api('/clients/'+id);set(`<h2>${esc(c.name)}</h2><div class=card><form id=pf><div class=row><input name=name value="${esc(c.name)}" required><input name=phone value="${esc(c.phone)}" placeholder=Phone></div><textarea name=notes rows=3 placeholder="Notes">${esc(c.notes)}</textarea><p><small>${esc(c.email)} · ${c.total} appointments · last visit ${c.last?fmt(c.last):'none'} · client since ${fmt(c.created_at)}</small></p><button class=btn>Save</button> <button type=button class="btn g" id=bk>Back</button></form></div><div class=card><h3>Upcoming</h3>${ls(c.upcoming)}</div><div class=card><h3>History</h3>${ls(c.history)}</div>`);
$('#bk').onclick=()=>shell('clients');$('#pf').onsubmit=e=>{e.preventDefault();act(()=>api('/clients/'+id,'PATCH',Object.fromEntries(new FormData(e.target))),'Client saved')}};
const _cl2=V.clients;V.clients=async function(){await _cl2();document.querySelectorAll('[data-d]').forEach(b=>{const td=b.closest('tr').children[0];td.innerHTML=`<a href=# data-p=${b.dataset.d}>${td.innerHTML}</a>`});bindP()};
const _ap=V.appointments;V.appointments=async function(){await _ap();const [list,sv]=await Promise.all([api('/appointments'),api('/services')]);
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const a=list.find(x=>x.id==b.dataset.e),d=document.createElement('dialog'),loc=new Date(new Date(a.start_utc)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
d.innerHTML=`<form id=ef><h3>Edit appointment</h3><p>${esc(a.client.name)} · ${esc(a.client.email)}</p><div class=row><select name=service_id>${sv.map(s=>`<option value=${s.id} ${s.id==a.service.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select name=status>${['pending','confirmed','completed','cancelled','no_show'].map(x=>`<option ${x==a.status?'selected':''}>${x}</option>`).join('')}</select></div><div class=row><input type=datetime-local name=start value="${loc}" required></div><textarea name=notes rows=3 placeholder=Notes>${esc(a.notes)}</textarea><div class=row style="margin-top:8px"><button class=btn>Save</button><button type=button class="btn g" id=cx>Close</button></div></form>`;
document.body.append(d);d.showModal();d.querySelector('#cx').onclick=()=>{d.close();d.remove()};
d.querySelector('#ef').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),p={notes:f.notes},iso=new Date(f.start).toISOString();
if(new Date(iso).getTime()!=new Date(a.start_utc).getTime())p.start=iso;if(+f.service_id!=a.service.id)p.service_id=+f.service_id;if(f.status!=a.status)p.status=f.status;
act(async()=>{await api('/appointments/'+a.id,'PATCH',p);d.close();d.remove();shell('appointments')},'Appointment updated')}})};

async function pubBook(slug){let info;try{info=await api('/public/'+slug)}catch{R.innerHTML='<div class=pub><div class=card>Booking page not found.</div></div>';return}
let sel=null,start=null;const today=new Date().toISOString().slice(0,10);
R.innerHTML=`<div class=pub><h1>${esc(info.business)}</h1><div class=card><h3>1. Choose a service</h3><select id=sv><option value="">Select…</option>${info.services.map(s=>`<option value=${s.id}>${esc(s.name)} · ${s.duration_min} min${+s.price?' · '+s.price:''}</option>`).join('')}</select></div>
<div class=card><h3>2. Pick a day and time</h3><input type=date id=dt min=${today}><p id=sl class=slots></p><small style="color:var(--mut)">Times in your local timezone</small></div>
<div class=card id=det style="display:none"><h3>3. Your details</h3><form id=f><div class=row><input name=name placeholder=Name required><input name=email type=email placeholder=Email required></div><div class=row><input name=phone placeholder="Phone (optional)"></div><button class=btn>Confirm booking</button></form></div></div>`;
async function load(){start=null;$('#det').style.display='none';if(!$('#sv').value||!$('#dt').value)return;$('#sl').innerHTML='<span class=skel style="width:100%"></span>';
// the user's local date -> query the business-local date; slots are shown in visitor's tz
const s=await api(`/public/${slug}/slots?service_id=${$('#sv').value}&date=${$('#dt').value}`);
$('#sl').innerHTML=s.length?s.map(t=>`<button class="btn g" data-t="${t}">${new Date(t).toLocaleTimeString([], {timeStyle:'short'})}</button>`).join(''):'<span class=empty>No times free that day.</span>';
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{start=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.className='btn g');b.className='btn';$('#det').style.display='block'})}
$('#sv').onchange=load;$('#dt').onchange=load;
$('#f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));Object.assign(d,{service_id:+$('#sv').value,start});
act(async()=>{const r=await api(`/public/${slug}/book`,'POST',d);R.innerHTML=`<div class=pub><div class=card><h2>You're booked</h2><p>${esc(r.service)} on ${fmt(r.start)}. A confirmation email is on its way.</p><a href="/manage/${r.token}">Reschedule or cancel</a></div></div>`}).catch(()=>load())}}

async function manage(t){try{const a=await api('/manage/'+t);R.innerHTML=`<div class=pub><div class=card><h2>${esc(a.business)}</h2><p>${esc(a.service.name)} · ${fmt(a.start_utc,a.timezone)} <span class="tag ${a.status}">${a.status}</span></p>
${['pending','confirmed'].includes(a.status)?`<button class="btn d" id=c>Cancel appointment</button> <a class="btn g" style="text-decoration:none" href="/book/${a.slug}">Book a different time</a>`:''}</div></div>`;
const c=$('#c');if(c)c.onclick=()=>confirm('Cancel this appointment?')&&act(async()=>{await api(`/manage/${t}/cancel`,'POST',{});manage(t)},'Cancelled')}catch{R.innerHTML='<div class=pub><div class=card>Link not valid.</div></div>'}}
</script></body></html>
